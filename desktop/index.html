<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>酸民模擬器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#151520;--red:#ef4444;--orange:#f97316;--yellow:#eab308;--accent:#22d3ee;--muted:#64748b;--text:#e2e8f0;--radius:16px}
html,body{height:100%;font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;min-height:0}
header{text-align:center;padding:14px 0 6px;flex-shrink:0}
header h1{font-size:1.3rem;color:var(--red);letter-spacing:2px}
header p{font-size:.75rem;color:var(--muted);margin-top:2px}
.rage-bar{height:6px;background:#1e1e2e;border-radius:3px;margin:0 16px 8px;overflow:hidden;flex-shrink:0}
.rage-fill{height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--red));border-radius:3px;width:0;transition:width .6s ease}
#chat{flex:1;min-height:0;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.msg{max-width:85%;padding:10px 14px;border-radius:var(--radius);font-size:.92rem;line-height:1.55;animation:popIn .25s ease;flex-shrink:0}
.msg.user{align-self:flex-end;background:var(--accent);color:#000;font-weight:500;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--card);color:var(--text);border:1px solid #2a2a3a;border-bottom-left-radius:4px;position:relative;overflow:hidden}
.msg.bot::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);border-radius:3px 0 0 3px}
.msg.bot.r1::before{background:var(--yellow)}
.msg.bot.r2::before{background:var(--orange)}
.msg.bot.r3::before{background:var(--red)}
.msg.bot.r3{animation:shake .3s ease,bounce .3s ease}
@keyframes popIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.input-row{display:flex;gap:6px;padding:12px 16px;background:rgba(10,10,15,.95);border-top:1px solid #1a1a2e;flex-shrink:0}
.input-row input{flex:1;background:#1a1a2e;border:1px solid #2a2a3a;border-radius:12px;padding:12px 14px;color:var(--text);font-size:.95rem;outline:none;transition:border-color .2s}
.input-row input:focus{border-color:var(--accent)}
.input-row button{background:var(--red);border:none;border-radius:12px;padding:12px 18px;color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .15s}
.input-row button:active{transform:scale(.95)}
.input-row button:disabled{opacity:.3;cursor:not-allowed}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🖕 酸民模擬器 🖕</h1>
    <p>來啊，繼續啊，看你能撐幾句</p>
  </header>
  <div class="rage-bar"><div class="rage-fill" id="rageFill"></div></div>
  <div id="chat"></div>
  <div class="input-row">
    <input id="userInput" type="text" placeholder="想酸我？來啊..." enterkeyhint="send" autocomplete="off">
    <button id="sendBtn" onclick="userSend()">酸！</button>
  </div>
</div>

<script>
var rage=0,rounds=0,cooldown=false;
var chat=document.getElementById('chat');
var input=document.getElementById('userInput');
var rageFill=document.getElementById('rageFill');
var sendBtn=document.getElementById('sendBtn');
function userSend(){o();}
function o(){
  if(cooldown)return;
  var t=input.value.trim();
  if(!t)return;
  input.value='';
  addMsg(t,'user');
  rounds++;
  rage=Math.min(rage+2,100);
  rageFill.style.width=rage+'%';
  rageFill.parentElement.style.animation=rage>60?'pulse .8s infinite':'';
  cooldown=true;
  sendBtn.disabled=true;
  input.disabled=true;
  setTimeout(function(){
    var r=Math.min(Math.floor(rounds/3),3);
    var pool=rg[r];
    addMsg(pool[Math.floor(Math.random()*pool.length)],'bot r'+r);
    cooldown=false;
    sendBtn.disabled=false;
    input.disabled=false;
    input.focus();
  },600+Math.random()*700);
}
function addMsg(t,c){
  var d=document.createElement('div');
  d.className='msg '+c;
  d.textContent=t;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}
input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();o();}});
addMsg('哈囉，莓問題，酸民本人到場。想對線？來，我奉陪。','bot r0');
input.focus();
</script>
